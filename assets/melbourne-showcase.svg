<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title"><title id="title">Melbourne Traffic Simulator. Baseline: 49,810 building pieces, 1,459 vehicles across a 15-minute replay.</title><rect x="0" y="0" width="1200" height="280" rx="10" fill="#0d141c"/><text x="40" y="45" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16" fill="#65dacd" font-weight="400">SELECTED SOFTWARE PROJECT / 01</text><text x="40" y="102" font-family="Arial, Helvetica, sans-serif" font-size="43" fill="#f1f5f9" font-weight="700">Melbourne Traffic Simulator</text><text x="40" y="143" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#b1c0cf" font-weight="400">Real geography. Synthetic traffic. An interactive 3D city.</text><rect x="40" y="170" width="1120" height="1" rx="0" fill="#2a3a49"/><text x="44" y="219" font-family="Arial, Helvetica, sans-serif" font-size="34" fill="#f1f5f9" font-weight="700">49,810</text><text x="44" y="254" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#b1c0cf" font-weight="400">rendered building pieces</text><text x="428" y="219" font-family="Arial, Helvetica, sans-serif" font-size="34" fill="#f1f5f9" font-weight="700">1,459</text><text x="428" y="254" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#b1c0cf" font-weight="400">vehicles across the replay</text><text x="812" y="219" font-family="Arial, Helvetica, sans-serif" font-size="34" fill="#f1f5f9" font-weight="700">15 minutes</text><text x="812" y="254" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#b1c0cf" font-weight="400">included baseline replay</text></svg>